<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتجات | شادي ستور</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #0d0d0d;
      padding: 20px;
      box-shadow: 0 0 30px #0ff;
    }

    header h1 {
      margin: 0;
      font-size: 2em;
      color: #0ff;
    }

    .product-section {
      padding: 30px 15px;
    }

    .product {
      background-color: #1a1a1a;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #0ff;
      max-width: 400px;
    }

    .product h3 {
      margin-top: 0;
      font-size: 1.6em;
      color: #0ff;
    }

    .product p {
      font-size: 14px;
      margin: 10px 0;
    }

    .product button {
      background-color: #0ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    footer {
      padding: 20px;
      background-color: #0d0d0d;
      color: #aaa;
      font-size: 0.9em;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5em;
      }

      .product h3 {
        font-size: 1.2em;
      }

      .product p {
        font-size: 13px;
      }

      .product button {
        font-size: 0.95em;
        padding: 10px 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>ثسم منتجات شادي ستور </h1>
  </header>

  <div class="product-section">
    <div class="product">
      <h3> PUBG MOBILE </h3>
      <p>اشترِ الآن بأفضل الأسعار.</p>
      <button>دخول</button>
    </div>

    <div class="product">
      <h3> FREE FIRE </h3>
      <p>اشحن حسابك مباشرة.</p>
      <button>دخول</button>
    </div>

    <div class="product">
      <h3> TIK TOK </h3>
      <p>زيادة متابعين لايكات مشاهدات عملات </p>
      <button>دخول</button>
    </div>

    <div class="product">
      <h3> INSTAGRAM </h3>
      <p>زيادة متابعين لايكات مشاهدات عملات </p>
      <button>دخول</button>
    </div>

    <div class="product">
      <h3> Telegram</h3>
      <p>رفع مشاهدات القنوات.</p>
      <button>دخول</button>
    </div>
  </div>

  <footer>
    جميع الحقوق محفوظة © شادي ستور 2025
  </footer>
</body>
</html>
